<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="stylesheet" href="./css/main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
</head>

<body>

<div class="calculadora">

    <div class="pantalla">0</div>

    <button id="ac" class="btn">AC</button>
    <button id="parentesis" class="btn">( )</button>
    <button id="porc" class="btn">%</button>
    <button id="division" class="btn">&divide;</button>

    <button class="btn">7</button>
    <button class="btn">8</button>
    <button class="btn">9</button>
    <button id="multp" class="btn">&times;</button>

    <button class="btn">4</button>
    <button class="btn">5</button>
    <button class="btn">6</button>
    <button id="resta" class="btn">-</button>

    <button class="btn">1</button>
    <button class="btn">2</button>
    <button class="btn">3</button>
    <button id="suma" class="btn">+</button>

    <button id="cero" class="btn">0</button>
    <button id="punto" class="btn">.</button>
    <button id="borrar" class="btn">&#9003;</button>
    <button id="igual" class="btn">=</button>

</div>

<script src="./js/main.js"></script>

</body>
</html>
